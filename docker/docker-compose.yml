services:
  mysql:
    image: mysql:8.4
    container_name: football-analytics-mysql

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: football_analytics
      MYSQL_USER: football
      MYSQL_PASSWORD: football123

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    restart: unless-stopped

volumes:
  mysql_data: